<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スペースZ - 3Dテスト</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #00ffcc;
      font-family: sans-serif; font-size: 16px; pointer-events: none;
    }
  </style>
  <!-- ブラウザで3Dを動かす仕組み（Three.js）を読み込む -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="info">【スペースZ 開発テスト】<br>W・A・S・Dキー：宇宙船の移動 / スペースキー：レーザー発射</div>

  <script>
    // 1. 宇宙空間（シーン）とカメラの準備
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ライトを追加
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // 2. プレイヤーの宇宙船（仮の三角形モデル）
    const shipGeo = new THREE.ConeGeometry(1, 3, 4);
    shipGeo.rotateX(Math.PI / 2); // 先端を前に向ける
    const shipMat = new THREE.MeshPhongMaterial({ color: 0x00ffff, flatShading: true });
    const ship = new THREE.Mesh(shipGeo, shipMat);
    scene.add(ship);

    // 3. 背景の星をちりばめる
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 1000; i++) {
      starPos.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 50 - 20, (Math.random() - 0.5) * 200);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 }));
    scene.add(stars);

    // 4. キーボード操作とレーザー発射の仕組み
    const keys = {};
    const lasers = [];
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') shootLaser();
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    function shootLaser() {
      const laserGeo = new THREE.BoxGeometry(0.2, 0.2, 1.5);
      const laserMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
      const laser = new THREE.Mesh(laserGeo, laserMat);
      laser.position.copy(ship.position);
      scene.add(laser);
      lasers.push(laser);
    }

    // 5. 毎フレームのアニメーション更新
    function animate() {
      requestAnimationFrame(animate);

      // 宇宙船の移動（WASD）
      const speed = 0.3;
      if (keys['KeyW']) ship.position.z -= speed;
      if (keys['KeyS']) ship.position.z += speed;
      if (keys['KeyA']) ship.position.x -= speed;
      if (keys['KeyD']) ship.position.x += speed;

      // レーザーの移動
      for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].position.z -= 1.0;
        if (lasers[i].position.z < -100) {
          scene.remove(lasers[i]);
          lasers.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
