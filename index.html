<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スペースZ - 軌道上バトル</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000208; font-family: 'Segoe UI', sans-serif; }
    #hud {
      position: absolute; top: 18px; left: 20px; color: #70f0ff;
      font-size: 15px; pointer-events: none; text-shadow: 0 0 8px rgba(0, 200, 255, 0.8);
      background: rgba(5, 15, 30, 0.55); padding: 12px 18px;
      border-left: 3px solid #ff7700; border-radius: 0 8px 8px 0;
      line-height: 1.6;
    }
    #status { color: #ffaa33; font-size: 18px; font-weight: bold; }
    #gameover {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center; color: #ff4455;
      background: rgba(5, 10, 20, 0.9); padding: 35px 55px; border: 2px solid #ff4455;
      border-radius: 12px; box-shadow: 0 0 30px rgba(255, 50, 80, 0.5);
    }
    button {
      margin-top: 15px; padding: 12px 28px; font-size: 16px; cursor: pointer;
      background: linear-gradient(90deg, #ff6600, #ffaa00); color: #000;
      border: none; border-radius: 6px; font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <strong>【スペースZ - 第2弾：惑星軌道グラフィック強化】</strong><br>
    操作：W・A・S・Dで操縦 / スペースキーで2連レーザー<br>
    <span id="status">HP: 100 | スコア: 0 | クリスタル: 0</span>
  </div>

  <div id="gameover">
    <h1>機体大破！</h1>
    <p id="final-score" style="color: #fff; font-size: 18px;"></p>
    <button onclick="location.reload()">再出撃する</button>
  </div>

  <script>
    // 1. シーン・カメラ・レンダラー
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020612, 0.0022);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5.5, 13);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. ライティング（太陽光＋惑星からの照り返し）
    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.8);
    sunLight.position.set(40, 60, -30);
    scene.add(sunLight);

    const planetBounceLight = new THREE.DirectionalLight(0x3399ff, 0.8);
    planetBounceLight.position.set(0, -50, 10);
    scene.add(planetBounceLight);

    scene.add(new THREE.AmbientLight(0x223355, 0.9));

    // 3. 眼下に広がる巨大な青い惑星（プロシージャルテクスチャ生成）
    function createPlanetTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 深い海のグラデーション
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, '#1a66b8');
      grad.addColorStop(0.5, '#0d4a8a');
      grad.addColorStop(1, '#1a66b8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      // 大陸の描画
      ctx.fillStyle = '#3b7a57';
      for (let i = 0; i < 35; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * 512, 40 + Math.random() * 176, 12 + Math.random() * 28, 0, Math.PI * 2);
        ctx.fill();
      }
      // 雲の帯
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      for (let i = 0; i < 60; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random() * 512, Math.random() * 256, 20 + Math.random() * 50, 4 + Math.random() * 8, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    const planetGroup = new THREE.Group();
    const planetGeo = new THREE.SphereGeometry(130, 64, 64);
    const planetMat = new THREE.MeshPhongMaterial({
      map: createPlanetTexture(),
      shininess: 25
    });
    const planet = new THREE.Mesh(planetGeo, planetMat);
    planetGroup.add(planet);

    // 大気圏の青い光の輪（ハロー）
    const atmoGeo = new THREE.SphereGeometry(133.5, 64, 64);
    const atmoMat = new THREE.MeshBasicMaterial({
      color: 0x44bbff,
      transparent: true,
      opacity: 0.22,
      side: THREE.BackSide
    });
    planetGroup.add(new THREE.Mesh(atmoGeo, atmoMat));
    planetGroup.position.set(0, -138, -50);
    scene.add(planetGroup);

    // 4. 遠くに浮かぶ巨大な多面体宇宙ステーション（コリオリス型）
    const stationGroup = new THREE.Group();
    const stationCore = new THREE.Mesh(
      new THREE.IcosahedronGeometry(16, 1),
      new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.8, roughness: 0.35, flatShading: true })
    );
    const stationWire = new THREE.Mesh(
      new THREE.IcosahedronGeometry(16.2, 1),
      new THREE.MeshBasicMaterial({ color: 0x88ccff, wireframe: true, transparent: true, opacity: 0.25 })
    );
    // ステーションのドッキングベイ光
    const dockPort = new THREE.Mesh(
      new THREE.BoxGeometry(6, 2.5, 4),
      new THREE.MeshBasicMaterial({ color: 0x00ffff })
    );
    dockPort.position.set(0, 0, 14.5);
    stationGroup.add(stationCore, stationWire, dockPort);
    stationGroup.position.set(22, 16, -130);
    scene.add(stationGroup);

    // 5. 高精細プレイヤー宇宙船（赤メタリック＋オレンジ発光ダクト＋青スラスター）
    const shipGroup = new THREE.Group();

    const hullMat = new THREE.MeshStandardMaterial({ color: 0xb81d24, metalness: 0.75, roughness: 0.25 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x1e2229, metalness: 0.8, roughness: 0.4 });
    const ventMat = new THREE.MeshBasicMaterial({ color: 0xff8800 });
    const thrusterMat = new THREE.MeshBasicMaterial({ color: 0x66eeff });

    // メイン胴体（鋭いデルタ形状）
    const mainBody = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5.2, 4), hullMat);
    mainBody.rotation.x = -Math.PI / 2;
    mainBody.scale.set(1.3, 1.0, 0.32);
    shipGroup.add(mainBody);

    // コックピットキャノピー
    const canopy = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 0.45, 1.6),
      new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.95, roughness: 0.1 })
    );
    canopy.position.set(0, 0.45, -0.4);
    shipGroup.add(canopy);

    // 左右のウイング＆装甲
    [-1, 1].forEach(side => {
      const wing = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.22, 2.4), hullMat);
      wing.position.set(side * 1.8, -0.05, 0.8);
      wing.rotation.y = side * -0.35;
      shipGroup.add(wing);

      // オレンジ色の放熱スリット（参考画像の特徴的な発光パーツ）
      const vent = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.26, 1.1), ventMat);
      vent.position.set(side * 1.4, 0.12, 0.9);
      vent.rotation.y = side * -0.25;
      shipGroup.add(vent);

      // 後部スラスターノズル＆青い噴射炎
      const nozzle = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.45, 0.6), darkMat);
      nozzle.position.set(side * 0.9, 0, 2.3);
      shipGroup.add(nozzle);

      const flame = new THREE.Mesh(new THREE.ConeGeometry(0.42, 2.2, 8), thrusterMat);
      flame.rotation.x = Math.PI / 2;
      flame.position.set(side * 0.9, 0, 3.4);
      flame.name = 'thruster';
      shipGroup.add(flame);
    });

    scene.add(shipGroup);

    // 6. 背景の星空
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 1800; i++) {
      starPos.push((Math.random() - 0.5) * 350, (Math.random() - 0.5) * 200 + 20, (Math.random() - 0.5) * 350 - 50);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 }));
    scene.add(stars);

    // ゲーム状態管理
    let hp = 100;
    let score = 0;
    let crystals = 0;
    let isGameOver = false;

    const lasers = [];
    const enemies = [];
    const loots = [];
    const particles = [];

    function updateHUD() {
      document.getElementById('status').textContent = `HP: ${hp} | スコア: ${score} | クリスタル: ${crystals}`;
    }

    // 7. キーボード操作
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && !isGameOver) shootLaser();
    });
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // 2連装ビームレーザー発射
    function shootLaser() {
      [-1.3, 1.3].forEach(offsetX => {
        const laserGeo = new THREE.BoxGeometry(0.18, 0.18, 3.2);
        const laserMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
        const laser = new THREE.Mesh(laserGeo, laserMat);
        laser.position.copy(shipGroup.position);
        laser.position.x += offsetX;
        laser.position.z -= 1.8;
        scene.add(laser);
        lasers.push(laser);
      });
    }

    // 8. 敵戦闘機の生成
    function spawnEnemy() {
      if (isGameOver) return;
      const eGroup = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.ConeGeometry(1.4, 3.6, 5),
        new THREE.MeshStandardMaterial({ color: 0x333b48, metalness: 0.8, roughness: 0.3 })
      );
      body.rotation.x = Math.PI / 2;
      body.scale.set(1.2, 1.0, 0.45);

      const eWing = new THREE.Mesh(
        new THREE.BoxGeometry(4.2, 0.2, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x991b1b, metalness: 0.7, roughness: 0.3 })
      );
      const eEngine = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff5500 })
      );
      eEngine.position.z = -1.6;

      eGroup.add(body, eWing, eEngine);
      eGroup.position.set((Math.random() - 0.5) * 34, (Math.random() - 0.5) * 6, -95);
      scene.add(eGroup);
      enemies.push(eGroup);
    }
    setInterval(spawnEnemy, 1500);

    // 9. お宝（スペースクリスタル）
    function dropLoot(pos) {
      const lootGeo = new THREE.OctahedronGeometry(1.0);
      const lootMat = new THREE.MeshStandardMaterial({
        color: 0xffd700, emissive: 0xff8800, emissiveIntensity: 0.6, metalness: 0.9, roughness: 0.1
      });
      const loot = new THREE.Mesh(lootGeo, lootMat);
      loot.position.copy(pos);
      scene.add(loot);
      loots.push(loot);
    }

    // 火花＆爆発エフェクト
    function createExplosion(pos, color) {
      for (let i = 0; i < 16; i++) {
        const pGeo = new THREE.BoxGeometry(0.32, 0.32, 0.32);
        const pMat = new THREE.MeshBasicMaterial({ color: color });
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.copy(pos);
        p.userData.vel = new THREE.Vector3(
          (Math.random() - 0.5) * 0.9,
          (Math.random() - 0.5) * 0.9,
          (Math.random() - 0.5) * 0.9
        );
        p.userData.life = 30;
        scene.add(p);
        particles.push(p);
      }
    }

    // 10. メインループ
    function animate() {
      requestAnimationFrame(animate);
      if (isGameOver) return;

      // 惑星と宇宙ステーションのゆっくりした自転
      planet.rotation.y += 0.0008;
      stationGroup.rotation.z += 0.003;

      // 自機の移動とリアルな傾き（バンク角）
      const speed = 0.38;
      let targetRoll = 0;
      let targetPitch = 0;

      if (keys['KeyW'] && shipGroup.position.z > -25) { shipGroup.position.z -= speed; targetPitch = -0.15; }
      if (keys['KeyS'] && shipGroup.position.z < 10)  { shipGroup.position.z += speed; targetPitch = 0.15; }
      if (keys['KeyA'] && shipGroup.position.x > -20) { shipGroup.position.x -= speed; targetRoll = 0.45; }
      if (keys['KeyD'] && shipGroup.position.x < 20)  { shipGroup.position.x += speed; targetRoll = -0.45; }

      // 機体の傾きを滑らかに補間
      shipGroup.rotation.z += (targetRoll - shipGroup.rotation.z) * 0.12;
      shipGroup.rotation.x += (targetPitch - shipGroup.rotation.x) * 0.12;

      // スラスター炎の揺らぎ演出
      shipGroup.children.forEach(child => {
        if (child.name === 'thruster') {
          child.scale.y = 0.85 + Math.random() * 0.35;
        }
      });

      // カメラが自機の後ろを滑らかに追従
      const targetCamX = shipGroup.position.x * 0.65;
      const targetCamY = shipGroup.position.y + 4.8;
      const targetCamZ = shipGroup.position.z + 11.5;
      camera.position.x += (targetCamX - camera.position.x) * 0.1;
      camera.position.y += (targetCamY - camera.position.y) * 0.1;
      camera.position.z += (targetCamZ - camera.position.z) * 0.1;
      camera.lookAt(shipGroup.position.x * 0.8, shipGroup.position.y + 0.5, shipGroup.position.z - 25);

      // レーザー更新
      for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].position.z -= 1.6;
        if (lasers[i].position.z < -120) {
          scene.remove(lasers[i]);
          lasers.splice(i, 1);
        }
      }

      // 敵機の更新と当たり判定
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.position.z += 0.32;
        e.rotation.z = Math.sin(Date.now() * 0.003 + i) * 0.25;

        let hit = false;
        for (let j = lasers.length - 1; j >= 0; j--) {
          if (e.position.distanceTo(lasers[j].position) < 2.6) {
            createExplosion(e.position, 0xffaa33);
            dropLoot(e.position);
            scene.remove(e);
            enemies.splice(i, 1);
            scene.remove(lasers[j]);
            lasers.splice(j, 1);
            score += 100;
            updateHUD();
            hit = true;
            break;
          }
        }
        if (hit) continue;

        if (e.position.distanceTo(shipGroup.position) < 2.6) {
          createExplosion(e.position, 0xff3333);
          scene.remove(e);
          enemies.splice(i, 1);
          hp -= 25;
          updateHUD();
          if (hp <= 0) {
            isGameOver = true;
            document.getElementById('final-score').textContent = `最終スコア: ${score} / 回収クリスタル: ${crystals}個`;
            document.getElementById('gameover').style.display = 'block';
          }
          continue;
        }

        if (e.position.z > 20) {
          scene.remove(e);
          enemies.splice(i, 1);
        }
      }

      // クリスタル回収判定
      for (let i = loots.length - 1; i >= 0; i--) {
        const l = loots[i];
        l.rotation.y += 0.06;
        l.rotation.x += 0.04;
        l.position.z += 0.14;

        if (l.position.distanceTo(shipGroup.position) < 3.0) {
          createExplosion(l.position, 0xffee55);
          scene.remove(l);
          loots.splice(i, 1);
          crystals += 1;
          score += 50;
          updateHUD();
          continue;
        }
        if (l.position.z > 20) {
          scene.remove(l);
          loots.splice(i, 1);
        }
      }

      // 火花パーティクル更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.add(p.userData.vel);
        p.userData.life--;
        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
